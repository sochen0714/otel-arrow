{% macro forward_variables() -%}
{%- for k, v in variables.items() %}
                {{k}}: {{v | tojson}}
{%- endfor %}
{%- endmacro -%}
{% set verify_command = 'python3 kafka_syslog_delivery.py --output-dir "' ~ test_dir ~ '" --protocol ' ~ ('otap' if otap_export else 'otlp') ~ (' --expect-full-delivery' if target_rate == 1000 else '') %}
steps:
  - name: Deploy Backend Engine
    action:
      component_action:
        phase: deploy
        target: backend-service
    hooks:
      run:
        pre:
          - render_template:
              template_path: '{{backend_config}}'
              output_path: '{{test_dir}}/backend-config.rendered.yaml'
              variables:{{forward_variables()}}
                core_start: 2
                core_end: 2
          - run_command:
              command: 'cp "{{test_dir}}/backend-config.rendered.yaml" "{{data_dir}}/backend-config.rendered.yaml"'
        post:
          - ready_check_http:
              url: http://localhost:18087/api/v1/telemetry/metrics?reset=false
              method: GET
              expected_status_code: 200
  - name: Deploy Kafka Broker
    action:
      component_action:
        phase: deploy
        target: kafka-broker
  - name: Wait for Kafka Broker
    action:
      no_op: {}
    hooks:
      run:
        pre:
          - run_command:
              command: >-
                for attempt in $(seq 1 30); do
                if timeout 5 docker exec kafka-broker /opt/kafka/bin/kafka-topics.sh
                --bootstrap-server localhost:9092 --list; then exit 0; fi;
                sleep 2; done; echo "Kafka did not become ready" >&2; exit 1
  - name: Create Syslog Topic
    action:
      no_op: {}
    hooks:
      run:
        pre:
          - run_command:
              command: >-
                docker exec kafka-broker /opt/kafka/bin/kafka-topics.sh
                --bootstrap-server localhost:9092 --create --if-not-exists
                --topic otel-syslog --partitions 1 --replication-factor 1
  - name: Deploy Kafka Consumer
    action:
      component_action:
        phase: deploy
        target: kafka-consumer
    hooks:
      run:
        pre:
          - render_template:
              template_path: '{{kafka_consumer_config}}'
              output_path: '{{test_dir}}/kafka-consumer-config.rendered.yaml'
              variables:{{forward_variables()}}
                core_start: 1
                core_end: 1
          - run_command:
              command: 'cp "{{test_dir}}/kafka-consumer-config.rendered.yaml" "{{data_dir}}/kafka-consumer-config.rendered.yaml"'
        post:
          - ready_check_http:
              url: http://localhost:18088/api/v1/telemetry/metrics?reset=false
              method: GET
              expected_status_code: 200
  - name: Deploy Load Generator
    action:
      component_action:
        phase: deploy
        target: load-generator
    hooks:
      run:
        post:
          - ready_check_http:
              url: http://localhost:18085/metrics
              method: GET
              expected_status_code: 200
          - run_command:
              command: >-
                docker inspect --format {% raw %}'{{.Name}} {{.Image}}'{% endraw %}
                load-generator kafka-broker kafka-consumer backend-service
                > "{{test_dir}}/images.txt"
  - name: Monitor All
    action:
      multi_component_action:
        phase: start_monitoring
        targets: [backend-service, load-generator, kafka-broker, kafka-consumer]
  - name: Start Raw Syslog Producer
    action:
      no_op: {}
    hooks:
      run:
        pre:
          - send_http_request:
              url: http://localhost:18085/start
              method: POST
              timeout: 60
              payload:
                load_type: syslog
                syslog_transport: kafka
                syslog_format: rfc5424
                syslog_content_type: random
                kafka_brokers: kafka-broker:9092
                kafka_topic: otel-syslog
                target_rate: {{target_rate}}
                threads: {{loadgen_threads}}
                batch_size: {{loadgen_batch_size}}
                body_size: {{message_size}}
                message_size: {{message_size}}
  - name: Warm Up
    action:
      wait:
        delay_seconds: {{wait_for_data_interval}}
  - name: Observe Load
    action:
      wait:
        delay_seconds: {{observation_interval}}
    hooks:
      run:
        pre:
          - send_http_request:
              url: http://localhost:18085/status
              method: GET
          - record_event:
              name: observation_start
        post:
          - record_event:
              name: observation_stop
          - send_http_request:
              url: http://localhost:18085/status
              method: GET
  - name: Stop and Flush Producer
    action:
      no_op: {}
    hooks:
      run:
        pre:
          - send_http_request:
              url: http://localhost:18085/stop
              method: POST
              timeout: 60
          - run_command:
              command: 'curl --max-time 5 --fail --silent --show-error http://localhost:18085/metrics -o "{{test_dir}}/producer-final.prom"'
  - name: Bounded Consumer Drain
    # Producer is off; this wait does not assert the backlog has fully drained.
    action:
      wait:
        delay_seconds: {{drain_wait_secs}}
  - name: Stop Kafka Consumer
    action:
      no_op: {}
    hooks:
      run:
        pre:
          - run_command:
              command: 'curl --max-time 5 --fail --silent --show-error "http://localhost:18088/api/v1/telemetry/metrics?format=prometheus&reset=false" -o "{{test_dir}}/consumer-before-shutdown.prom"'
          - send_http_request:
              url: http://localhost:18088/api/v1/groups/shutdown?wait=true&timeout_secs={{drain_timeout_secs}}
              method: POST
              timeout: {{drain_timeout_secs + 5}}
  - name: Capture Final Backend Counters
    # Include consumer shutdown progress, but scrape while backend admin is alive.
    action:
      wait:
        delay_seconds: 1
    hooks:
      run:
        post:
          - run_command:
              command: 'curl --max-time 5 --fail --silent --show-error "http://localhost:18087/api/v1/telemetry/metrics?format=prometheus&reset=false" -o "{{test_dir}}/backend-final.prom"'
  - name: Capture Kafka Record and Verify Delivery
    # Sample after final counters so Kafka CLI startup cannot extend the cutoff.
    action:
      no_op: {}
    hooks:
      run:
        pre:
          - run_command:
              command: >-
                timeout 20 docker exec kafka-broker /opt/kafka/bin/kafka-console-consumer.sh
                --bootstrap-server localhost:9092 --topic otel-syslog --from-beginning
                --max-messages 1 --timeout-ms 10000 > "{{test_dir}}/kafka-record.txt"
          - run_command:
              command: '{{verify_command}}'
  - name: Stop Backend
    action:
      no_op: {}
    hooks:
      run:
        pre:
          - send_http_request:
              url: http://localhost:18087/api/v1/groups/shutdown?wait=true&timeout_secs={{drain_timeout_secs}}
              method: POST
              timeout: {{drain_timeout_secs + 5}}
  - name: Wait For Metrics Update
    action:
      wait:
        delay_seconds: 1
  - name: Stop Monitoring All
    action:
      multi_component_action:
        phase: stop_monitoring
        targets: [backend-service, load-generator, kafka-broker, kafka-consumer]
  - name: Destroy All
    action:
      multi_component_action:
        phase: destroy
        targets: [load-generator, kafka-consumer, kafka-broker, backend-service]
  - name: Run Report
    action:
      no_op: {}
    hooks:
      run:
        # Cleanup can continue after failure; recheck evidence before reporting.
        pre:
          - run_command:
              command: '{{verify_command}}'
        post:
          - print_container_logs: {}
          - sql_report:
              name: '{{report_name}}'
              report_config_file: '{{report}}'
              output:
                - format:
                    template: {}
                  destination:
                    console: {}
                - format:
                    template:
                      path: ../pipeline_perf_test/test_suites/integration/templates/reports/gh-action-sqlreport.j2
                  destination:
                    file:
                      directory: '{{test_dir}}'
                - format:
                    template:
                      path: ../pipeline_perf_test/test_suites/comparison_dashboard/templates/reports/dashboard-timeseries.j2
                  destination:
                    file:
                      directory: '{{test_dir}}'
                      name: timeseries
