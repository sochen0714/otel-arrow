# Manual-commit consumer whose terminal node always returns a Nack.
#
# The error exporter refuses every batch. The Kafka receiver treats that Nack as
# terminal, records it, advances the offset, and does not redeliver the record.
version: otel_dataflow/v1

engine:
  telemetry:
    logs:
      level: "info"

groups:
  default:
    pipelines:
      main:
        policies:
          channel_capacity:
            control:
              node: 100
              pipeline: 100
            pdata: 16

        nodes:
          kafka-receiver:
            type: "urn:otel:receiver:kafka"
            config:
              brokers: ${env:KAFKA_BROKERS:-localhost:9092}
              group_id: ${env:KAFKA_GROUP_ID:-terminal-failure-drop-count}
              client_id: terminal-failure-consumer
              auto_offset_reset: earliest
              commit:
                mode: manual
              lag_refresh_interval_ms: 1000
              logs:
                topics:
                  - ${env:KAFKA_TOPIC:-otlp-logs}
                encoding: otlp_proto

          failing-sink:
            type: "urn:otel:exporter:error"
            config:
              message: "terminal-failure-drop-count: deliberate nack"

        connections:
          - from: kafka-receiver
            to: failing-sink
