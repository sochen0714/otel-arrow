# Overlay that adds the OTAP dataflow engine container on top of compose.yaml.
#
#   docker compose -f compose.yaml -f compose.dataflow.yaml up --build
#
# A single df_engine container runs all six SASL-over-TLS pipelines (a producer
# and a consumer for each of PLAIN, SCRAM-SHA-256, and SCRAM-SHA-512). It reaches
# the broker's authenticated listener at kafka:9093 and trusts the local CA that
# certgen wrote into ./certs (mounted read-only at /home/nonroot/certs).
#
# Build contexts (relative to this file at
# rust/otap-dataflow/examples/kafka/sasl-tls):
#   context   ../../..          -> rust/otap-dataflow  (the crate sources)
#   otel-arrow ../../../../..   -> repo root           (proto + experimental)
#
# The Dockerfile is shared by every Kafka example and lives one level up at
# examples/kafka/Dockerfile.dataflow.

x-dataflow-build: &dataflow-build
  context: ../../..
  dockerfile: examples/kafka/Dockerfile.dataflow
  additional_contexts:
    otel-arrow: ../../../../..
  args:
    TARGETPLATFORM: linux/amd64
    FEATURES: kafka-receiver,kafka-exporter

services:
  dataflow:
    build: *dataflow-build
    image: otap-kafka-sasl-tls:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      # Consumed by kafka-sasl-tls.yaml via ${env:...} substitution.
      KAFKA_BROKERS: kafka:9093
      KAFKA_CA_FILE: /home/nonroot/certs/ca.crt
    volumes:
      - ./kafka-sasl-tls.yaml:/home/nonroot/kafka-sasl-tls.yaml:ro
      - ./certs:/home/nonroot/certs:ro
    ports:
      - "8080:8080"
    command:
      - "--config"
      - "file:/home/nonroot/kafka-sasl-tls.yaml"
      - "--num-cores"
      - "1"
      - "--http-admin-bind"
      - "0.0.0.0:8080"
