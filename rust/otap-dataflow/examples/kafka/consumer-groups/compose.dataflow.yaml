# Overlay that adds the OTAP dataflow engine containers on top of compose.yaml.
#
#   docker compose -f compose.yaml -f compose.dataflow.yaml up --build
#
# Three df_engine containers share one image (built once via the YAML anchor
# below): a single producer plus two consumer instances (consumer-a, consumer-b)
# that join the same Kafka consumer group and split the topic's partitions.
#
# Build contexts (relative to this file at
# rust/otap-dataflow/examples/kafka/consumer-groups):
#   context   ../../..          -> rust/otap-dataflow  (the crate sources)
#   otel-arrow ../../../../..   -> repo root           (proto + experimental)
#
# The Dockerfile is shared by every Kafka example and lives one level up at
# examples/kafka/Dockerfile.dataflow.

x-dataflow-build: &dataflow-build
  context: ../../..
  dockerfile: examples/kafka/Dockerfile.dataflow
  additional_contexts:
    otel-arrow: ../../../../..
  args:
    TARGETPLATFORM: linux/amd64
    FEATURES: kafka-receiver,kafka-exporter

services:
  producer:
    build: *dataflow-build
    image: otap-kafka-consumer-groups:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: otlp-logs
      KAFKA_CLIENT_ID: otap-producer
      # Bounded run so the group lag deterministically drains to zero. Set to
      # "null" for a continuous stream.
      KAFKA_MAX_SIGNAL_COUNT: ${KAFKA_MAX_SIGNAL_COUNT:-300}
      KAFKA_SIGNALS_PER_SECOND: ${KAFKA_SIGNALS_PER_SECOND:-50}
    volumes:
      - ./producer.yaml:/home/nonroot/producer.yaml:ro
    command: ["--config", "file:/home/nonroot/producer.yaml", "--num-cores", "1"]

  consumer-a:
    build: *dataflow-build
    image: otap-kafka-consumer-groups:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: otlp-logs
      KAFKA_GROUP_ID: otap-consumer-group
      KAFKA_CLIENT_ID: consumer-a
    ports:
      - "8080:8080"
    volumes:
      - ./consumer.yaml:/home/nonroot/consumer.yaml:ro
    command:
      - "--config"
      - "file:/home/nonroot/consumer.yaml"
      # Thread-per-core: each core runs its own kafka receiver and joins the
      # group as a distinct member. Override to 2+ (CONSUMER_A_CORES=2) to make
      # this single container present as multiple consumer-group members. See
      # the "One instance, multiple cores" validation case in README.md.
      - "--num-cores"
      - "${CONSUMER_A_CORES:-1}"
      - "--http-admin-bind"
      - "0.0.0.0:8080"

  consumer-b:
    build: *dataflow-build
    image: otap-kafka-consumer-groups:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: otlp-logs
      KAFKA_GROUP_ID: otap-consumer-group
      KAFKA_CLIENT_ID: consumer-b
    ports:
      - "8081:8080"
    volumes:
      - ./consumer.yaml:/home/nonroot/consumer.yaml:ro
    command:
      - "--config"
      - "file:/home/nonroot/consumer.yaml"
      - "--num-cores"
      - "1"
      - "--http-admin-bind"
      - "0.0.0.0:8080"

  # consumer-c backs the multi-core THROUGHPUT benchmark (README case 6). It is
  # in its own group by default so it owns every partition alone, making the
  # 1-core vs N-core drain comparison clean. Gated behind the "bench" profile so
  # a plain `docker compose up` still brings up only producer/consumer-a/consumer-b;
  # start it explicitly with `docker compose up -d --no-deps consumer-c`.
  consumer-c:
    profiles: ["bench"]
    build: *dataflow-build
    image: otap-kafka-consumer-groups:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: otlp-logs
      KAFKA_GROUP_ID: ${CONSUMER_C_GROUP:-otap-consumer-c-group}
      KAFKA_CLIENT_ID: consumer-c
    ports:
      - "8083:8080"
    volumes:
      - ./consumer.yaml:/home/nonroot/consumer.yaml:ro
    command:
      - "--config"
      - "file:/home/nonroot/consumer.yaml"
      # Each core is a distinct group member; with >= 3 partitions the cores
      # drain in parallel. Override with CONSUMER_C_CORES (benchmark uses 1 vs 3).
      - "--num-cores"
      - "${CONSUMER_C_CORES:-3}"
      - "--http-admin-bind"
      - "0.0.0.0:8080"

  # Bench-only producer: writes a large, decode-heavy backlog for the consumer-c
  # throughput benchmark. Separate from `producer` so cases 1-5 are unaffected.
  # Start it explicitly (it exits when KAFKA_MAX_SIGNAL_COUNT records are sent):
  #   docker compose up -d --no-deps producer-bench
  producer-bench:
    profiles: ["bench"]
    build: *dataflow-build
    image: otap-kafka-consumer-groups:latest
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: otlp-logs
      KAFKA_CLIENT_ID: otap-producer-bench
      KAFKA_MAX_SIGNAL_COUNT: ${KAFKA_MAX_SIGNAL_COUNT:-250000}
      KAFKA_SIGNALS_PER_SECOND: ${KAFKA_SIGNALS_PER_SECOND:-100000}
      KAFKA_NUM_LOG_ATTRS: ${KAFKA_NUM_LOG_ATTRS:-25}
      KAFKA_LOG_BODY_BYTES: ${KAFKA_LOG_BODY_BYTES:-64}
    volumes:
      - ./producer-bench.yaml:/home/nonroot/producer-bench.yaml:ro
    command: ["--config", "file:/home/nonroot/producer-bench.yaml", "--num-cores", "1"]
